# The licence of this repository (https://reuse.software/spec-3.3/): MIT,
# like the Lantern specification and the SDK it is built on.
version = 1

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 JigSawFr"
SPDX-License-Identifier = "MIT"

# Boréale's fonts and mark, copied from boreale-site (each font's own notice is beside it).
[[annotations]]
path = "src/lantern_bridge/admin/static/*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "The Sora, Figtree and JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/lantern_bridge/admin/static/OFL-*.txt"
precedence = "override"
SPDX-FileCopyrightText = "The Sora, Figtree and JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/lantern_bridge/admin/static/twemoji-flags.woff2", "src/lantern_bridge/admin/static/LICENSE-twemoji-flags.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2019 Twitter, Inc and other contributors (the flags' art, Twemoji)", "2022 TalkJS (the font's code)"]
SPDX-License-Identifier = "CC-BY-4.0 AND MIT"
