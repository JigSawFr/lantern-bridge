[build-system]
# Pinned, so that a release can be built again byte for byte; raised by hand.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "lantern-bridge"
description = "A gateway that presents a Tinfoil, Ownfoil or AeroFoil library, or plain folders, as a Lantern server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
authors = [{ name = "JigSawFr" }]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["lantern", "homebrew", "game library", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
# The server toolkit does the protocol (routes, pairing, tokens, files, events);
# the bridge adds the sources. uvicorn runs the FastAPI adapter.
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "lantern-protocol[fastapi]",
    "nsz>=5.0",
    "paho-mqtt>=2.1.0",
    "pycryptodome>=3.20",
    "tomli-w>=1.2.0",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
lantern-bridge = "lantern_bridge.__main__:main"

[project.urls]
Homepage = "https://github.com/JigSawFr/lantern-bridge"
Specification = "https://github.com/JigSawFr/lantern"
SDK = "https://github.com/JigSawFr/lantern-sdk"
Issues = "https://github.com/JigSawFr/lantern-bridge/issues"
Changelog = "https://github.com/JigSawFr/lantern-bridge/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
    "mypy>=1.13",
    "ruff>=0.8",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
]

# uv (https://docs.astral.sh/uv/) installs the development environment from
# uv.lock: `uv sync`, then `uv run pytest`. Its resolver takes no file
# uploaded in the last 14 days: a release has two weeks to be yanked before
# `uv lock` can pick it up.
[tool.uv]
exclude-newer = "14 days"

# The SDK is a submodule (sdk/), fixed on a commit: its python/ folder is the
# dependency. The SDK has no release yet; once it has, the submodule goes and
# this line with it, and the dependency is a version range.
[tool.uv.sources]
lantern-protocol = { path = "sdk/python", editable = true }

[tool.hatch.version]
path = "src/lantern_bridge/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src/lantern_bridge", "tests", "README.md", "LICENSES", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/lantern_bridge"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# The submodules are checked by their own CI
extend-exclude = ["sdk", "library"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET", "TC", "PL", "S", "BLE", "ASYNC"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "RET505", "RET506", "SIM108",
    "PLC0415",
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B011", "BLE001", "PT018", "PT011"]
# The site scripts read our own build output and write long HTML lines
"tools/**" = ["E501", "S314", "PLW0603"]
"tools/demo_serve.py" = ["S101", "S105"]  # a made-up library and a throwaway password, for the website's screenshots
# The French texts of the pages are long sentences
"src/lantern_bridge/admin/i18n.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lantern_bridge"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not conformance'"
markers = [
    "conformance: the specification's conformance suite against the running bridge (needs the SDK's own submodules)",
]

[tool.coverage.run]
source = ["lantern_bridge"]
branch = true

[tool.coverage.report]
# Today's 92 %, rounded down: a drop fails the run instead of going unnoticed
fail_under = 90

[[tool.mypy.overrides]]
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true
