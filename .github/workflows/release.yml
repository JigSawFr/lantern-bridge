# A release of the bridge (RELEASING.md): started by the GitHub release
# release-please creates (release-please.yml), or by hand for a tag. The
# Python files are built from the tag, reproducibly (tools/release_build.sh),
# with their SBOM, and the container image for amd64 and arm64; then every
# file and the image are attested (SLSA build provenance, signed through
# Sigstore; the SBOM linked to what it describes), listed in SHA256SUMS and
# attached to the release; then the package goes to PyPI by trusted
# publishing, once the SDK it depends on is there too. Nothing here runs
# before a release exists.
name: release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (vX.Y.Z), the one chosen above in 'Use workflow from': its files built, attested and attached again"
        required: true
        type: string
      publish:
        description: "Publish to PyPI too (a version already there is refused by it)"
        type: boolean
        default: false

permissions:
  contents: read

# One run a release at a time; never one cancelled halfway through publishing
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_VERSION: 0.13.6
  IMAGE: ghcr.io/jigsawfr/lantern-bridge

jobs:
  meta:
    name: the version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: The tag and the version
        id: version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a version tag (vX.Y.Z)"; exit 1; }
          # By hand, from the tag itself (Use workflow from: Tags), so that the
          # attestations name the tag as their source, as the release's do
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::run this workflow from the tag $TAG, not from $GITHUB_REF"
            exit 1
          fi
          found=$(sed -n 's/^__version__ = "\(.*\)"  # x-release-please-version$/\1/p' src/lantern_bridge/_version.py)
          [ "$found" = "${TAG#v}" ] || { echo "::error::src/lantern_bridge/_version.py says '$found', the tag ${TAG#v}"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  python:
    name: python (sdist, wheel, SBOM)
    needs: meta
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          # sdk/: the Lantern SDK, the dependency (not its own submodules)
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # build, hatchling and cyclonedx-bom, and everything they need, by hash
      - name: The release's tools
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet --require-hashes -r tools/release-requirements.txt
      - name: Build
        env:
          PYTHON: ${{ runner.temp }}/tools/bin/python
        run: tools/release_build.sh -o dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          path: dist/
          if-no-files-found: error

  # The image: amd64 and arm64, pushed to GHCR under the version, its minor
  # and `latest`; its digest is attested below
  image:
    name: container image
    needs: meta
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write      # the attestation's Sigstore certificate
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          submodules: true
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The image's tags
        id: tags
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          {
            echo 'list<<EOF'
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:${VERSION%.*}"
            echo "$IMAGE:latest"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.list }}
          # Attested below, signed by GitHub's Sigstore identity, not by buildx
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      #   gh attestation verify oci://ghcr.io/jigsawfr/lantern-bridge:X.Y.Z -R JigSawFr/lantern-bridge
      - name: Image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Every file attested, listed and attached
  attest:
    name: attest and attach
    needs: [ meta, python, image ]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write      # the release's assets and notes
      id-token: write      # the attestations' Sigstore certificate
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-python
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      # Who built each file, from which commit, with which workflow:
      #   gh attestation verify FILE -R JigSawFr/lantern-bridge
      # GitHub's attestations, signed through Sigstore (no cosign key, and
      # SHA256SUMS is attested too).
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # The SBOM, linked to the files it describes:
      #   gh attestation verify FILE -R JigSawFr/lantern-bridge --predicate-type https://cyclonedx.org/bom
      - name: SBOM of the Python package
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/lantern_bridge-${{ env.VERSION }}-py3-none-any.whl
            dist/lantern_bridge-${{ env.VERSION }}.tar.gz
          sbom-path: dist/lantern-bridge-${{ env.VERSION }}.pypi.cdx.json
      # The release exists (release-please made it with the tag): the files
      # are added to it, a run again replacing its own
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh release upload "$TAG" --clobber dist/*
          {
            echo "## Lantern Bridge $VERSION"
            echo
            echo "Image: \`$IMAGE:$VERSION\` (\`$DIGEST\`)"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # PyPI, by trusted publishing: PyPI trusts this workflow, in the pypi
  # environment, of this repository (RELEASING.md). Only when the repository's
  # variable PUBLISH_TO_PYPI is true: the package requires lantern-protocol,
  # which must be on PyPI first (the SDK's own first release).
  pypi:
    name: publish to PyPI
    needs: [ meta, attest ]
    if: github.repository == 'JigSawFr/lantern-bridge' && vars.PUBLISH_TO_PYPI == 'true' && (github.event_name == 'release' || inputs.publish)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/lantern-bridge/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write      # trusted publishing, and the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-python
          path: dist
      # The sdist and the wheel alone: the action uploads all it finds
      - name: The packages
        run: |
          mkdir packages
          mv dist/*.whl dist/lantern_bridge-*.tar.gz packages/
          ls -l packages
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/
          attestations: true
          print-hash: true
