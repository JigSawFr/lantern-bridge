# The workflows themselves (.github/): actionlint, which reads each one and
# each composite action's use (expressions, reusable workflows' inputs and
# jobs, runner labels with .github/actionlint.yaml), and checks their shell
# scripts with shellcheck (the runner's); and zizmor, which looks for what
# makes a workflow unsafe (injections, permissions too wide, credentials left
# in a checkout, tokens that are not limited); and hadolint, which lints the
# Dockerfile.
name: workflows

# Called by ci.yml
on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      # actionlint_1.7.12_checksums.txt's line for linux_amd64
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          shellcheck --version | head -n 2
          "$RUNNER_TEMP/actionlint" -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # zizmor and what it needs, by hash (tools/zizmor-requirements.txt)
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes -r tools/zizmor-requirements.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --config .github/zizmor.yml --format github .github/workflows

  hadolint:
    name: hadolint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image, by digest (v2.14 of hadolint): raised by hand, Dependabot does not read workflows for images
      - name: hadolint
        run: |
          docker run --rm --interactive \
            ghcr.io/hadolint/hadolint@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 \
            < Dockerfile
