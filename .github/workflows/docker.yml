# The container image: built for amd64 and arm64, and each is run and
# checked on its own architecture (it answers the handshake, and does not run as
# root). Nothing is published from here: the release workflow will do that.
name: docker

on:
  workflow_call:

permissions: {}

jobs:
  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each platform is built on a machine of its own architecture: no emulation
        include:
          - { platform: linux/amd64, runner: ubuntu-26.04 }
          - { platform: linux/arm64, runner: ubuntu-26.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # sdk/: the Lantern SDK, the dependency (not its own submodules)
          submodules: true
      - name: Build
        run: docker buildx build --platform "${{ matrix.platform }}" --load --tag lantern-bridge:ci .
      - name: Run it
        run: |
          set -eu
          docker run --detach --name bridge --publish 8080:8080 lantern-bridge:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/.well-known/lantern; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/.well-known/lantern | grep -q '"uid"'
          test "$(docker exec bridge id -u)" != 0
          docker exec bridge lantern-bridge --version
          docker rm --force bridge
      - name: Container logs
        if: failure()
        run: docker logs bridge || true
