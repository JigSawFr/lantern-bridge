# On every push to main, release-please keeps a "chore(main): release X.Y.Z"
# pull request up to date from the Conventional Commits: CHANGELOG.md and the
# version in src/lantern_bridge/_version.py (release-please-config.json).
# Merging it creates the vX.Y.Z tag and the GitHub release. The packages and
# the image are built, attested and published by release.yml (RELEASING.md).
name: release-please

on:
  push:
    branches: [ main ]
  # Again by hand, e.g. after a failure of GitHub's API
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # A token of the release GitHub App, not GITHUB_TOKEN: what it creates
      # starts the other workflows (one GITHUB_TOKEN creates starts nothing).
      # Without the app (not set up yet), nothing is released.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # What release-please does: the release commit and tag, its pull request, its labels
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: vars.RELEASE_APP_ID != ''
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Without the release app
        if: vars.RELEASE_APP_ID == ''
        run: echo "No RELEASE_APP_ID variable, so no release pull request." >> "$GITHUB_STEP_SUMMARY"
