# The links out of the Bridge's website, followed once a week: which of them lead nowhere now. A failed run is the report.
# The check is boreale-site's (library/boreale-site/tools/check_links.py), run by its reusable workflow.
name: links

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    uses: JigSawFr/boreale-site/.github/workflows/links.yml@fe95805c576fd5c6a0e1457a401e6eb7527c2435 # main after #22
    with:
      build: python3 tools/build_site.py build
