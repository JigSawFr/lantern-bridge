# Known vulnerabilities, in what ships: the locked Python dependencies
# (pip-audit, from uv.lock) and the container image (Trivy). Once a week, on
# demand, and on a pull request that changes the lock or the Dockerfile. It is
# not part of `all green`: a new advisory against an unchanged lock must not
# block an unrelated pull request, so a failed weekly run is the report.
name: audit

on:
  schedule:
    - cron: "17 5 * * 2"
  pull_request:
    paths: [ "uv.lock", "pyproject.toml", "Dockerfile", ".github/workflows/audit.yml", "tools/audit-requirements.txt" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.13.6

jobs:
  python:
    name: python dependencies (pip-audit)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # sdk/: the Lantern SDK, the dependency (not its own submodules)
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # pip-audit and what it needs, by hash (tools/audit-requirements.txt)
      - name: pip-audit
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --quiet --require-hashes -r tools/audit-requirements.txt
          # What the image installs (no development tools); the SDK is ours, not on PyPI yet
          uv export --locked --no-dev --no-emit-project --no-emit-local --no-hashes --quiet -o "$RUNNER_TEMP/locked.txt"
          "$RUNNER_TEMP/audit/bin/pip-audit" --requirement "$RUNNER_TEMP/locked.txt" --no-deps --disable-pip --strict

  image:
    name: container image (Trivy)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Build
        run: docker build --tag lantern-bridge:audit .
      # Trivy is run from its image, pinned by digest (v0.76.2, raised by hand):
      # no binary is fetched while the job runs, and after the March 2026 incident
      # (GHSA-69fq-xp46-6x23) no action of Aqua's is used. The image is handed to
      # it as a file, so it gets no access to the Docker socket.
      - name: Save the image
        run: docker save --output "$RUNNER_TEMP/image.tar" lantern-bridge:audit
      # Fixed vulnerabilities only, high and critical: what an update can remove;
      # and secrets left in a layer
      - name: Trivy, the image
        run: |
          docker run --rm --volume "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /image.tar --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      # The Dockerfile's own mistakes (root user, no health check, a secret in an ENV...)
      - name: Trivy, the Dockerfile
        run: |
          docker run --rm --volume "$PWD/Dockerfile:/work/Dockerfile:ro" \
            ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            config --severity HIGH,CRITICAL --exit-code 1 /work
