{% extends "base.html" %}
{% block title %}{{ _("Sign in") }}{% endblock %}
{% block body %}
<div class="auth">
<img class="mark" src="/admin/static/bridge.svg" alt="" width="72" height="72">
<h1>{{ _("Sign in") }}</h1>
<p class="lede">{{ _("The administration pages of this bridge.") }}</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="stack">
  <label>{{ _("Name") }} <input name="name" autocomplete="username" required autofocus></label>
  <label>{{ _("Password") }} <input name="password" type="password" autocomplete="current-password" required></label>
  <button>{{ _("Sign in") }}</button>
</form>
</div>
{% endblock %}
